{% if user.is_authenticated %}
    <button class="btn btn-primary w-100" id="addToCartBtn" data-product-id="{{ product.id }}">
        <i class="fas fa-cart-plus me-2"></i>Add to Cart
    </button>
{% else %}
    <a href="{% url 'login' %}?next={% url 'product_detail' product.slug %}" class="btn btn-primary w-100">
        <i class="fas fa-sign-in-alt me-2"></i>Login to Purchase
    </a>
{% endif %}
