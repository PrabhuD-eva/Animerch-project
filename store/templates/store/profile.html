{% extends 'store/base.html' %}

{% block title %}Profile - Anime Merch Store{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row">
        <!-- Sidebar - My Account -->
        <div class="col-md-3">
            <div class="card shadow-lg border-0 mb-4">
                <div class="card-header bg-primary text-white py-3">
                    <h5 class="mb-0"><i class="fas fa-user-circle me-2"></i>My Account</h5>
                </div>
                <div class="list-group list-group-flush">
                    <a href="{% url 'profile' %}" class="list-group-item list-group-item-action active">
                        <i class="fas fa-user-edit me-2"></i>Profile Settings
                    </a>
                    <a href="{% url 'orders' %}" class="list-group-item list-group-item-action">
                        <i class="fas fa-shopping-bag me-2"></i>My Orders
                    </a>
                    <a href="{% url 'cart' %}" class="list-group-item list-group-item-action">
                        <i class="fas fa-shopping-cart me-2"></i>My Cart
                    </a>
                </div>
            </div>
        </div>
        
        <!-- Profile Content -->
        <div class="col-md-9">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0"><i class="fas fa-user-edit me-2"></i>Profile Settings</h4>
                </div>
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-circle fa-5x text-primary"></i>
                        <h4 class="mt-2">{{ user.username }}</h4>
                        <p class="text-muted">{{ user.email }}</p>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Username</label>
                            <input type="text" class="form-control" value="{{ user.username }}" readonly>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" class="form-control" value="{{ user.email }}" readonly>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">First Name</label>
                            <input type="text" class="form-control" value="{{ user.first_name }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Last Name</label>
                            <input type="text" class="form-control" value="{{ user.last_name }}">
                        </div>
                    </div>
                    
                    <hr>
                    
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'orders' %}" class="btn btn-primary">
                            <i class="fas fa-history me-2"></i>View My Orders
                        </a>
                        <a href="{% url 'index' %}" class="btn btn-secondary">
                            <i class="fas fa-home me-2"></i>Back to Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
